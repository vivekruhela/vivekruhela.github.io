# Track 3: how you think. Colours: A (green), C (blue), G (amber), T (red), accent.
pipeline:
  - { step: Variant, color: A, question: "What changed?", detail: "Whole-genome and exome variation, runs of homozygosity, ancestry." }
  - { step: Gene, color: C, question: "Which gene carries it?", detail: "Gene-level association, eQTL mapping, fine-mapping, colocalization." }
  - { step: Pathway, color: G, question: "What process breaks?", detail: "Signalling pathways and biologically informed deep learning." }
  - { step: Network, color: T, question: "Who else is affected?", detail: "Gene-gene interaction graphs and attention-based graph learning." }
  - { step: Explanation, color: accent, question: "Can I test it?", detail: "A short list of genes and mechanisms someone can take to the bench." }

principles:
  - { quote: "Explain why, not just what.", text: "A model that predicts well but cannot say which genes matter has not finished the job." }
  - { quote: "Ancestry is part of the answer.", text: "Signals found in one population often look different in another. Diverse cohorts are the point, not a robustness check." }
  - { quote: "If others can't run it, it isn't done.", text: "miRPipe, miRSim, BRAINscape and SAGA exist so the next lab starts further ahead." }
