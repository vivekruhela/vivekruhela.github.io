<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four files, one person</title>
<!-- Post 1.1, figure 1: the shape of each file that describes our people, and where one person
     sits in each. Plain HTML and SVG, no libraries, no data: the matrices are drawn to show
     shape, not values. Inside the blog it follows the site's light or dark theme; opened on its
     own it follows the OS setting. -->
<style>
  :root { --surface: #fcfcfb; --card: #f3f2ee; --ink: #0b0b0b; --ink2: #52514e; --line: #c9c8c2;
          --cell: #e4e3dd; --me: #eb6834; --me-soft: rgba(235,104,52,0.18); }
  :root.dark { --surface: #1a1a19; --card: #262624; --ink: #f0efec; --ink2: #c3c2b7; --line: #4a4a47;
               --cell: #3a3a37; --me: #f07a4a; --me-soft: rgba(240,122,74,0.22); }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 4px 2px 8px; background: transparent; color: var(--ink);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .key { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 2px 0 12px; }
  .id { font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--me);
        border: 2px solid var(--me); border-radius: 8px; padding: 2px 10px; }
  .key span.t { color: var(--ink2); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
  .card { background: var(--card); border-radius: 10px; padding: 10px 12px 12px; }
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  svg { display: block; max-width: 100%; height: auto; }
  .c { fill: var(--cell); }
  .me { fill: var(--me); }
  .m { display: flex; gap: 4px; margin: 2px 0 6px; }
  .vl { writing-mode: vertical-rl; font-size: 12px; color: var(--ink2); padding-top: 18px; }
  .hl { font-size: 12px; color: var(--ink2); height: 18px; }
  .meta { font-size: 12.5px; color: var(--ink2); margin: 2px 0; }
  .meta b { color: var(--ink); font-weight: 600; }
  code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
<div class="key"><span class="id">HG00096</span><span class="t">the one thing every file shares: the person's ID. Their part of each file is in orange.</span></div>
<div class="grid" id="grid"></div>
<script>
// each file: rows and columns of the small drawing, and whether the person is a column or a row
var FILES = [
  {name: "Genotypes", rows: 9, cols: 7, me: "col", r: "variants", c: "people",
   one: "one row per variant, one column per person", what: "0, 1 or 2 copies of an allele",
   file: "<code>.pgen</code> + <code>.pvar</code> + <code>.psam</code>, or <code>.vcf.gz</code>"},
  {name: "Expression", rows: 7, cols: 7, me: "col", r: "genes", c: "people",
   one: "one row per gene, one column per person", what: "read counts, or normalised levels",
   file: "a tab-separated matrix, <code>.tsv.gz</code>"},
  {name: "Methylation", rows: 6, cols: 7, me: "col", r: "CpGs", c: "people",
   one: "one row per CpG site, one column per person", what: "beta (0 to 1) or M-values",
   file: "a tab-separated matrix, <code>.tsv.gz</code>"},
  {name: "Clinical", rows: 7, cols: 5, me: "row", r: "people", c: "measures",
   one: "one row per person, one column per measurement", what: "age, BMI, the trait, the disease",
   file: "a tab-separated table, <code>.tsv</code>"}
];
function matrix(f) {
  var s = 12, gap = 3, W = f.cols * (s + gap) - gap, H = f.rows * (s + gap) - gap;
  var mi = f.me === "col" ? 2 : 1;               // which column (or row) is the person
  var out = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + Math.round(1.3 * W) + '" role="img" aria-label="' +
            f.name + ': ' + f.one + '">';
  for (var i = 0; i < f.rows; i++) for (var j = 0; j < f.cols; j++) {
    var me = f.me === "col" ? j === mi : i === mi;
    out += '<rect class="' + (me ? "me" : "c") + '" rx="2" x="' + j * (s + gap) + '" y="' + i * (s + gap) +
           '" width="' + s + '" height="' + s + '"/>';
  }
  out += '</svg>';
  return '<div class="m"><div class="vl">' + f.r + ' \u2192</div><div><div class="hl">' + f.c + ' \u2192</div>' +
         out + '</div></div>';
}
document.getElementById("grid").innerHTML = FILES.map(function (f) {
  return '<div class="card"><h3>' + f.name + '</h3>' + matrix(f) +
         '<p class="meta"><b>Shape:</b> ' + f.one + '</p>' +
         '<p class="meta"><b>Values:</b> ' + f.what + '</p>' +
         '<p class="meta"><b>File:</b> ' + f.file + '</p></div>';
}).join("");

function isDark() {
  try { var t = window.parent.document.documentElement.dataset.theme; if (t) return t === "dark"; } catch (err) {}
  return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
}
function paint() { document.documentElement.classList.toggle("dark", isDark()); }
// inside the blog (same site), grow or shrink the iframe to fit, so narrow screens see every card
function fit() {
  try { if (window.frameElement) window.frameElement.style.height = Math.ceil(document.body.getBoundingClientRect().height + 16) + "px"; } catch (err) {}
}
window.addEventListener("load", fit);
window.addEventListener("resize", fit);
paint();
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
try { new MutationObserver(paint).observe(window.parent.document.documentElement, {attributes: true, attributeFilter: ["data-theme"]}); } catch (err) {}
</script>
</body>
</html>
