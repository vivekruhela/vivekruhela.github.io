(function (gd) {
// Post 1.1: a "pick a person" menu above a Plotly figure, shared by the R and Python scripts.
// PEOPLE is a list of {label, group, x: [...], y: [...], card}; x[k] and y[k] are the new
// coordinates of the k-th highlight trace (the traces with meta "person", in order); card is a
// line of HTML about the person, shown above the figure.
// The menu is a plain <select>, so it follows the page's light or dark theme on its own.
function personPicker(gd, PEOPLE, START) {
  var TRACES = [];
  gd.data.forEach(function (t, i) {  // R's plotly repeats meta once per point
    var m = Array.isArray(t.meta) ? t.meta[0] : t.meta;
    if (m === 'person') TRACES.push(i);
  });
  var box = document.createElement('div');
  box.style.cssText = 'display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 4px 6px;' +
    'font:14px system-ui,-apple-system,"Segoe UI",sans-serif;';
  var lab = document.createElement('label');
  lab.textContent = 'Pick a person:';
  var sel = document.createElement('select');
  sel.style.cssText = 'font:inherit;padding:3px 6px;border-radius:6px;max-width:100%;';
  lab.htmlFor = sel.id = 'person-picker';
  var groups = {};
  PEOPLE.forEach(function (p, i) {
    if (!groups[p.group]) {
      groups[p.group] = document.createElement('optgroup');
      groups[p.group].label = p.group;
      sel.appendChild(groups[p.group]);
    }
    var o = document.createElement('option');
    o.value = i; o.textContent = p.label;
    groups[p.group].appendChild(o);
  });
  var rnd = document.createElement('button');
  rnd.type = 'button'; rnd.textContent = 'Someone else';
  rnd.style.cssText = 'font:inherit;padding:3px 10px;border-radius:999px;cursor:pointer;' +
    'border:1px solid #c9c8c2;background:transparent;color:inherit;';
  var card = document.createElement('div');
  card.style.cssText = 'flex-basis:100%;font-size:15px;margin-top:4px;';
  card.setAttribute('aria-live', 'polite');
  box.appendChild(lab); box.appendChild(sel); box.appendChild(rnd); box.appendChild(card);
  gd.parentNode.insertBefore(box, gd);
  function paint() {
    var dark = document.documentElement.style.colorScheme === 'dark';
    box.style.color = dark ? '#f0efec' : '#0b0b0b';
  }
  function show(i) {
    var p = PEOPLE[i];
    sel.value = i;
    Plotly.restyle(gd, {x: p.x, y: p.y}, TRACES);
    card.innerHTML = p.card;
  }
  sel.addEventListener('change', function () { show(+sel.value); });
  rnd.addEventListener('click', function () { show(Math.floor(Math.random() * PEOPLE.length)); });
  show(START || 0);
  paint();
  try { new MutationObserver(paint).observe(document.documentElement, {attributes: true, attributeFilter: ['style']}); } catch (err) {}
}
